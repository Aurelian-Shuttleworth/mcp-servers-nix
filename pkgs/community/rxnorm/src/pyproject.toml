[project]
name = "rxnorm-mcp-server"
version = "0.1.0"
description = "MCP server for RxNorm drug interactions and lookup"
authors = [
    { name = "Aurelian Shuttleworth", email = "aurelian@shuttleworth.tech" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]
requires-python = ">=3.10"

[project.scripts]
rxnorm-mcp-server = "rxnorm_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
